<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a4252"/>
      <stop offset="0.45" stop-color="#9b6b55"/>
      <stop offset="0.75" stop-color="#e2a86a"/>
      <stop offset="1" stop-color="#f3d39a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3d6"/>
      <stop offset="0.4" stop-color="#ffdca0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffdca0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7b6a5c"/><stop offset="1" stop-color="#5d5248"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f5c48"/><stop offset="1" stop-color="#36443a"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f4a3a"/><stop offset="1" stop-color="#1b2c22"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="700" fill="url(#sky)"/>
  <circle cx="300" cy="430" r="240" fill="url(#sun)"/>
  <circle cx="300" cy="430" r="46" fill="#fff1cf" opacity="0.9"/>

  <!-- distant hills of the Galilee -->
  <path d="M0 440 C180 400 300 420 460 395 C640 368 760 410 920 390 C1100 368 1240 400 1400 380 C1500 368 1560 375 1600 372 V700 H0Z" fill="url(#far)" opacity="0.75"/>

  <!-- town on the middle hill -->
  <path d="M0 500 C200 470 380 455 560 470 C760 485 900 440 1080 450 C1260 460 1420 480 1600 470 V700 H0Z" fill="url(#mid)"/>
  <g transform="translate(-520 0)">
  <g fill="#c9b08a" opacity="0.9">
    <rect x="640" y="452" width="34" height="26"/><rect x="680" y="445" width="28" height="33"/><rect x="712" y="456" width="40" height="22"/>
    <rect x="1010" y="436" width="30" height="28"/><rect x="1044" y="442" width="36" height="24"/><rect x="1084" y="432" width="26" height="34"/>
    <rect x="1240" y="452" width="34" height="24"/><rect x="1278" y="446" width="26" height="30"/><rect x="1306" y="456" width="38" height="22"/>
    <rect x="1130" y="440" width="30" height="26"/><rect x="1164" y="448" width="26" height="22"/>
  </g>
  <g fill="#e9d6b3">
    <!-- Basilica of the Annunciation -->
    <rect x="840" y="400" width="150" height="70"/>
    <rect x="880" y="372" width="70" height="30"/>
    <path d="M884 372 L915 262 L946 372Z"/>
    <rect x="910" y="244" width="10" height="22"/>
    <path d="M907 246 L915 228 L923 246Z"/>
    <rect x="770" y="420" width="70" height="50"/>
    <rect x="990" y="418" width="60" height="52"/>
    <!-- bell tower -->
    <rect x="1180" y="370" width="24" height="80"/>
    <path d="M1176 372 L1192 342 L1208 372Z"/>
  </g>
  <g fill="#3a3128" opacity="0.55">
    <rect x="860" y="420" width="10" height="16"/><rect x="890" y="420" width="10" height="16"/><rect x="930" y="420" width="10" height="16"/><rect x="960" y="420" width="10" height="16"/>
    <rect x="1188" y="388" width="8" height="12"/>
  </g>

  </g>

  <!-- near hill with olive trees and cypresses -->
  <path d="M0 560 C220 520 420 540 620 560 C860 585 1040 530 1260 540 C1420 548 1520 560 1600 556 V700 H0Z" fill="url(#near)"/>
  <g fill="#14231a">
    <ellipse cx="120" cy="520" rx="11" ry="46"/><ellipse cx="146" cy="530" rx="9" ry="36"/>
    <ellipse cx="1430" cy="520" rx="11" ry="48"/><ellipse cx="1456" cy="532" rx="8" ry="34"/>
    <ellipse cx="560" cy="535" rx="9" ry="34"/>
  </g>
  <g fill="#253a2c">
    <ellipse cx="300" cy="540" rx="46" ry="26"/><rect x="296" y="548" width="7" height="22"/>
    <ellipse cx="1130" cy="545" rx="50" ry="27"/><rect x="1126" y="552" width="7" height="22"/>
    <ellipse cx="760" cy="572" rx="40" ry="22"/><rect x="757" y="578" width="6" height="18"/>
  </g>
</svg>
